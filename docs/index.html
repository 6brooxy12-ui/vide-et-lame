<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Vide & Lame</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0c0e12; color: #e8e2d6; overflow: hidden; font-family: Georgia, serif; }
      #view { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
      .hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
      .row { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
      .kicker { letter-spacing: 0.28em; text-transform: uppercase; color: #c9a36a; font-size: 11px; font-family: sans-serif; }
      h1 { margin: 0; font-weight: normal; font-size: 24px; }
      .badge { border: 1px solid rgba(201, 163, 106, 0.4); background: rgba(0, 0, 0, 0.4); padding: 8px 12px; text-align: right; font-family: sans-serif; }
      .badge small { display: block; letter-spacing: 0.14em; text-transform: uppercase; color: #a39888; font-size: 10px; }
      #hint { max-width: 280px; font-family: sans-serif; font-size: 12px; line-height: 1.45; color: rgba(200, 192, 178, 0.9); }
      #strike { pointer-events: auto; display: none; min-height: 48px; border: 1px solid #c9a36a; background: #8e1c1c; color: #f6efe4; padding: 0 20px; letter-spacing: 0.08em; text-transform: uppercase; }
      .cross { position: fixed; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border: 1px solid rgba(243, 239, 230, 0.7); border-radius: 50%; pointer-events: none; }
      @media (max-width: 700px) { #strike { display: inline-block; } }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div class="cross"></div>
    <div class="hud">
      <div class="row">
        <div>
          <div class="kicker">Vide & Lame</div>
          <h1>Coup d'épée</h1>
        </div>
        <div class="badge"><small>Phase</small><span id="phase">Prêt</span></div>
      </div>
      <div class="row" style="align-items: flex-end">
        <p id="hint">Clique dans le monde pour entrer en vue première personne, puis frappe.</p>
        <button id="strike" type="button">Frapper</button>
      </div>
    </div>
    <script type="module" src="./game.js?v=3"></script>
  </body>
</html>
